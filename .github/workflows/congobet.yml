name: congobet-auto-scraper

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

concurrency:
  group: congobet-auto-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 58

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run orchestrator
        env:
          MAX_RUNTIME_MINUTES: '54'
          GAP_THRESHOLD_MINUTES: '3'
          CONGOBET_MATCHES_URL: 'https://www.congobet.net/virtual/category/instant-league/8035/matches'
          CONGOBET_RESULTS_URL: 'https://www.congobet.net/virtual/category/instant-league/8035/results'
          TZ: 'UTC'
        run: python scripts/congobet_bot.py

      - name: Commit data
        run: |
          if git diff --quiet -- data; then
            echo "No data change to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "chore: update CongoBet data $(date -u +'%Y-%m-%dT%H:%M:%SZ')" || exit 0
          git push
